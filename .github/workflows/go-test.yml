name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Test against the real OpenSSH client
        env:
          MASSH_REQUIRE_SSH: "1"
        run: |
          ssh -V
          go test -race -v -run 'TestOpenSSHReal' .
